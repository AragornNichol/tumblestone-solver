<!DOCTYPE html>
<html>
    <head>
        <title>Tumblestone Solver</title>
    </head>
    <!--Would like to make a page explaining each wildcard for clarity-->
    <body>
        <script src="formscript.js"></script>
        <p>Use R,G,B,Y,P for the coloured stones, # for blockers (use 0 if they start open), and % to indicate wildcards.</p>
    <!--form to take the board state and wildcards-->
    <form>
        <label for="board">Input the board state:</label>
        <br>
        <textarea id="board" name="board" rows="10"></textarea>
        <br>
        <label>Modifiers:</label>
        <br>
        
        <input type="checkbox" id="toggle-blockers" name="toggle-blockers">
        <label for="toggle-blockers">Toggling Blockers</label> 
        <br>
        
        <input type="checkbox" id="wildcards" name="wildcards" onchange="wildOptions(this)">
        <label for="wildcards">Wildcards</label> 
        <br>
        <div id="wildcard-options" style="margin-left:20px;display:none">
        <label for="wildcard-colours" id = "wildcard-colours-label">Wildcard colours:</label>
        <br>
        <input type="text" id="wildcard-colours" name="wildcard-colours">
        <br>
        </div>

        <input type="checkbox" id="colour-lock" name="colour-lock">
        <label for="colour-lock">Colour Lock</label> 
        <br>        

        <input type="checkbox" id="sprouts" name="sprouts">
        <label for="sprouts">Sprouts</label> 
        <br>

        <input type="checkbox" id="stagg-locks" name="stagg-locks" onchange="staggOptions(this)">
        <label for="stagg-locks">Staggered Locks</label> 
        <br>
        <div id="stagg-options" style="margin-left:20px;display:none">
        <label for="stagg-locks-initial">Inital state of top left stone:</label>
        <br>
        <input type="radio" id="tl-off" name="init-stagger">
        <label for="off">Unlocked</label><br>
        <input type="radio" id="tl-on" name="init-stagger">
        <label for="on">Locked</label>
        <br>
        </div>

        <input type="checkbox" id="row-lock" name="row-lock" onchange="rowLockOptions(this)">
        <label for="row-lock">Row Lock</label>
        <br>
        <div id = row-options style="margin-left:20px;display:none">
        <label for="locked-row">Locked row (count from the top):</label>
        <br>
        <input type="text" id="locked-row" name="locked-row">
        <br>
        </div>

        <input type="checkbox" id="double-shot" name="double-shot">
        <label for="double-shot">Double Shot</label>
        <br>

        <input type="checkbox" id="column-flip" name="column-flip">
        <label for="column-flip">Column Flipping</label>
        <br>
        
        <input type="checkbox" id="sspt" name="sspt">
        <label for="sspt">Second Shot Pass Through</label>
        <br>

        <input type="checkbox" id="countdown-blockers" name="countdown-blockers">
        <label for="countdown-blockers">Countdown Blockers</label>
        <br>
    </form>
    </body>
</html>
